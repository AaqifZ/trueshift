# SwiftLint configuration for Trueshift

excluded:
  - .build
  - Packages
  - DerivedData

# Rules configuration
disabled_rules:
  - trailing_whitespace  # Too noisy for initial setup
  - todo  # Allow TODO comments
  - line_length  # Will enable later with higher limit

opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - number_separator
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unused_declaration
  - vertical_parameter_alignment_on_call

# Rule-specific settings
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - ok
    - to
    - up
    - fl  # finish line
    - bt  # bedtime
    - b   # brightness

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 3

# Custom rules
custom_rules:
  no_hardcoded_kelvin:
    name: "No Magic Kelvin Values"
    regex: '\b(?:6500|5500|2700|1200|1000)\b(?!K)'
    message: "Use named constants for Kelvin values (e.g., config.dayTemp instead of 6500)"
    severity: warning
    match_kinds:
      - number
